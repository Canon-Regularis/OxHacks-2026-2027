# Tests, then builds both images, then deploys them to the Vultr VPS: the `production` branch to
# the production environment and `main` to development. Pull requests run the tests and image
# builds only. Setup: gridpulse/deploy/README.md.
name: CI/CD

on:
  push:
    branches: [main, production]
    paths:
      - gridpulse/backend/**
      - gridpulse/frontend/**
      - gridpulse/db/**
      - gridpulse/data/demo/**
      - gridpulse/deploy/**
      - gridpulse/.dockerignore
      - .github/workflows/deploy.yml
  pull_request:
    paths:
      - gridpulse/backend/**
      - gridpulse/frontend/**
      - gridpulse/db/**
      - gridpulse/data/demo/**
      - gridpulse/deploy/**
      - gridpulse/.dockerignore
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull request runs are cancelled; each branch's deploys queue one after another.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gridpulse/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gridpulse/backend/pyproject.toml
      - run: pip install -e ".[dev]"
      # Integration tests skip themselves without GRIDPULSE_INTEGRATION=1 and a database.
      # Parametrized test ids must not contain addresses or set orderings, or xdist workers
      # disagree about which tests exist.
      - run: pytest -n auto

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gridpulse/frontend
    steps:
      - uses: actions/checkout@v7
      - id: app
        run: echo "present=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.app.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gridpulse/frontend/package-lock.json
      - if: steps.app.outputs.present == 'true'
        run: |
          npm ci
          npm run check --if-present
          npm run test --if-present

  # Pull requests build only the images their diff can change. Pushes and manual runs build both.
  changes:
    name: Changed components
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.diff.outputs.components }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request is checked out as a merge commit; its first parent is the base branch.
          fetch-depth: 2
      - id: diff
        run: |
          backend=false frontend=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || ! git rev-parse -q --verify HEAD^1 > /dev/null; then
            backend=true frontend=true
          else
            while IFS= read -r file; do
              case "$file" in
                gridpulse/backend/* | gridpulse/db/* | gridpulse/data/demo/*) backend=true ;;
                gridpulse/frontend/*) frontend=true ;;
                # The workflow, deploy files and .dockerignore can affect either image.
                *) backend=true frontend=true ;;
              esac
            done < <(git diff --name-only HEAD^1 HEAD)
          fi
          components=()
          [ "$backend" = true ] && components+=('"backend"')
          [ "$frontend" = true ] && components+=('"frontend"')
          echo "components=[$(IFS=,; echo "${components[*]}")]" >> "$GITHUB_OUTPUT"

  # Building does not need the tests to pass; only deploying does. Running them side by side keeps
  # the slowest of the two off the critical path. On main and production the branch tag therefore
  # moves before the tests finish, but deploys use the sha tag and wait for them.
  images:
    name: ${{ matrix.component }} image
    needs: changes
    if: needs.changes.outputs.components != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    steps:
      - uses: actions/checkout@v7
      - id: image
        # Registry paths must be lower case.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gridpulse-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: gridpulse
          file: gridpulse/${{ matrix.component }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          # sha-<commit> is what gets deployed; the branch tag is what `docker compose up` uses by hand.
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ contains(fromJSON('["main", "production"]'), github.ref_name) && format('{0}:{1}', steps.image.outputs.name, github.ref_name) || '' }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: Deploy ${{ github.ref_name == 'production' && 'production' || 'development' }}
    needs: [backend-tests, frontend-checks, images]
    # Only the two deployed branches; skipped until the VPS is configured (gridpulse/deploy/README.md).
    if: >-
      github.event_name != 'pull_request' && vars.VPS_HOST != ''
      && contains(fromJSON('["main", "production"]'), github.ref_name)
    runs-on: ubuntu-latest
    # Each GitHub environment may set its own PUBLIC_URL and RUN_MIGRATIONS.
    environment: ${{ github.ref_name == 'production' && 'production' || 'development' }}
    permissions:
      contents: read
      packages: read
    env:
      APP_DIR: ${{ github.ref_name == 'production' && '/opt/gridpulse' || '/opt/gridpulse-dev' }}
      PROXY_DIR: /opt/gridpulse-proxy
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: gridpulse/deploy

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key when it is configured; otherwise trust it on first use.
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$VPS_HOST" > ~/.ssh/known_hosts
          fi
          # One connection serves the scp and ssh calls below instead of a handshake for each.
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  ControlMaster auto\n  ControlPath ~/.ssh/control-%%C\n  ControlPersist 120\n' \
            "$VPS_HOST" "${VPS_USER:-deploy}" > ~/.ssh/config

      - name: Copy compose files, proxy config and deploy script
        run: |
          scp gridpulse/deploy/docker-compose.yml gridpulse/deploy/deploy.sh "vps:$APP_DIR/"
          scp gridpulse/deploy/proxy/docker-compose.yml "vps:$PROXY_DIR/"
          scp gridpulse/deploy/proxy/Caddyfile "vps:$PROXY_DIR/conf/"

      - name: Pull images, migrate and restart
        env:
          # The job's own token: it can read this repository's images and expires with the job.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          RUN_MIGRATIONS: ${{ vars.RUN_MIGRATIONS || 'true' }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh vps "
            docker login ghcr.io -u '$ACTOR' --password-stdin > /dev/null || exit 1
            IMAGE_TAG='sha-$GITHUB_SHA' REGISTRY='ghcr.io/${GITHUB_REPOSITORY_OWNER,,}' \
              PROXY_DIR='$PROXY_DIR' RUN_MIGRATIONS='$RUN_MIGRATIONS' bash '$APP_DIR/deploy.sh'
            status=\$?
            docker logout ghcr.io > /dev/null
            exit \$status
          "

      - name: Check the public URL
        if: vars.PUBLIC_URL != ''
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          body=$(curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$PUBLIC_URL/api/health")
          echo "$body"
          if [ "$(jq -r .status <<< "$body")" != "ok" ]; then
            echo "::warning::Deployed, but /api/health reports: $body"
          fi
